name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # ── Lint · Build · Test ──────────────────────────────────────────────

  go:
    name: go
    uses: ./.github/workflows/_go.yaml
    with:
      targets: >-
        [
          "cmd/mroki-api",
          "cmd/mroki-proxy"
        ]

  pnpm:
    name: pnpm
    uses: ./.github/workflows/_pnpm.yaml
    with:
      targets: >-
        [
          "web/mroki-hub",
          "web/mroki-site"
        ]

  # ── Deploy docs site to GitHub Pages ──────────────────────────────────

  pages:
    name: pages
    # Publish only on merge to main; PRs still build + link-check via the pnpm job.
    # Build-many → deploy-once (a repo has one Pages site): the docs site
    # (landing at /mroki/ + docs under /mroki/docs) is the only source today.
    # A future hub demo plugs in as one more entry, e.g.:
    #   { "name": "hub", "dir": "web/mroki-hub", "dist": "dist", "subpath": "hub" }
    # served at /mroki/hub/ (needs vite `base: '/mroki/hub/'` + demo data).
    if: github.ref == 'refs/heads/main'
    needs: [pnpm]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/_pages.yaml
    with:
      sources: >-
        [
          {
            "name": "site",
            "dir": "web/mroki-site",
            "dist": ".vitepress/dist",
            "subpath": "."
          }
        ]

  # ── Push Docker images ────────────────────────────────────────────────

  docker:
    name: docker
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [go, pnpm]
    uses: ./.github/workflows/_docker.yaml
    with:
      targets: >-
        [
          "build/package/mroki-api",
          "build/package/mroki-proxy",
          "build/package/mroki-hub",
          "build/package/mroki-db-migrator"
        ]
    secrets: inherit

  # ── Helm ──────────────────────────────────────────────────────────────

  helm:
    name: helm
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [docker]
    uses: ./.github/workflows/_helm.yaml
    with:
      targets: >-
        [
          "deployments/kubernetes/charts/mroki"
        ]
    secrets: inherit

  # ── Release ───────────────────────────────────────────────────────────

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [helm]
    uses: ./.github/workflows/_release.yaml
    secrets: inherit
