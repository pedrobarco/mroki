name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # ── Lint · Build · Test ──────────────────────────────────────────────

  go:
    name: go
    uses: ./.github/workflows/_go.yaml
    with:
      targets: >-
        [
          "cmd/mroki-api",
          "cmd/mroki-proxy"
        ]

  pnpm:
    name: pnpm
    uses: ./.github/workflows/_pnpm.yaml
    with:
      targets: >-
        [
          "web/mroki-hub",
          "web/mroki-site"
        ]

  # ── Deploy docs site to GitHub Pages ──────────────────────────────────

  pages:
    name: pages
    # Publish only on merge to main; PRs still build + link-check via the pnpm job.
    if: github.ref == 'refs/heads/main'
    needs: [pnpm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
        with:
          working-directory: web/mroki-site
      - name: Build docs site
        working-directory: web/mroki-site
        run: pnpm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/mroki-site/.vitepress/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── Push Docker images ────────────────────────────────────────────────

  docker:
    name: docker
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [go, pnpm]
    uses: ./.github/workflows/_docker.yaml
    with:
      targets: >-
        [
          "build/package/mroki-api",
          "build/package/mroki-proxy",
          "build/package/mroki-hub",
          "build/package/mroki-db-migrator"
        ]
    secrets: inherit

  # ── Helm ──────────────────────────────────────────────────────────────

  helm:
    name: helm
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [docker]
    uses: ./.github/workflows/_helm.yaml
    with:
      targets: >-
        [
          "deployments/kubernetes/charts/mroki"
        ]
    secrets: inherit

  # ── Release ───────────────────────────────────────────────────────────

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [helm]
    uses: ./.github/workflows/_release.yaml
    secrets: inherit
